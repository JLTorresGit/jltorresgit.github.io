<footer class="site-footer">
  <div class="wrap footer-row">
    <span>&copy; {{ site.time | date: "%Y" }} {{ site.author }}</span>
    <span class="footer-links">
      {% if site.contact_email != "" %}<a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a>{% endif %}
      {% if site.github_username != "" %}<a href="https://github.com/{{ site.github_username }}">GitHub</a>{% endif %}
      {% if site.buy_me_a_coffee != "" %}<a href="{{ site.buy_me_a_coffee }}">Buy me a coffee</a>{% endif %}
    </span>
  </div>
</footer>
